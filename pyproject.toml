[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-workflow-engine"
version = "0.1.0"
description = "A modular LangGraph execution engine for specialised AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "langgraph>=0.2.60,<2",
  "langchain-core>=0.3.25,<2",
  "langchain-openai>=0.2.10,<2",
  "langchain-anthropic>=0.3.3,<2",
  "langchain-google-genai>=2.0.0,<5",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
