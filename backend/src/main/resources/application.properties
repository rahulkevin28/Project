spring.application.name=demo

# PostgreSQL connection settings. Set DB_PASSWORD in the process environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flowforge}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes; Hibernate only checks mappings against the migrated schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Existing databases are adopted at version 0 so the first versioned migration runs.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Python AI engine. Keep ENGINE_API_TOKEN in the process environment or secret store.
engine.base-url=${ENGINE_BASE_URL:http://localhost:8765}
engine.api-token=${ENGINE_API_TOKEN}
engine.connect-timeout=${ENGINE_CONNECT_TIMEOUT:5s}
engine.response-timeout=${ENGINE_RESPONSE_TIMEOUT:930s}

# A single administrator is provisioned from the process environment; no default credentials.
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

# Server-side administrator session. Secure cookies are enabled by default.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict
